<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Share Pro Trader</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="/static/js/pinyin-match.js"></script>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <!-- Red Zone -->
            <div class="sidebar-header">
                <h2>股票池</h2>
                <button id="toggle-sidebar-btn" class="icon-btn" title="Toggle Sidebar">◀</button>
            </div>
            <ul id="stock-list">
                <!-- Stock list will be populated here -->
            </ul>
            <div id="stock-wheel" class="hidden">
                <button id="wheel-up-btn" class="wheel-btn">▲</button>
                <div class="wheel-items">
                    <div id="wheel-prev" class="wheel-item dim"></div>
                    <div id="wheel-curr" class="wheel-item highlight"></div>
                    <div id="wheel-next" class="wheel-item dim"></div>
                </div>
                <button id="wheel-down-btn" class="wheel-btn">▼</button>
            </div>
        </aside>

        <main id="main-content">
            <header class="chart-header">
                <div class="header-left">
                    <h1 id="current-stock-title">请选择股票</h1>
                </div>
                <div class="header-center">
                    <!-- Blue Zone -->
                    <div class="search-container">
                        <div class="search-wrapper">
                            <input type="text" id="search-input" placeholder="代码/拼音 (e.g., 000001)" autocomplete="off">
                            <ul id="search-suggestions" class="suggestions-list hidden"></ul>
                        </div>
                    </div>
                </div>
                <div class="header-right controls">
                    <!-- Green Zone -->
                    <button id="screener-btn" title="执行选股策略过滤当前列表" class="sync-btn" style="margin-right: 15px;">选股策略</button>
                    <button id="backtest-btn" title="执行回测模拟" class="sync-btn" style="margin-right: 15px;" disabled>模拟回测</button>
                    <button id="update-list-btn" title="获取股票列表并下载全量数据" class="sync-btn" style="margin-right: 15px;">一键同步历史数据</button>
                    <div class="period-selectors">
                        <button class="active" data-period="daily">日线</button>
                        <button data-period="weekly">周线</button>
                        <button data-period="monthly">月线</button>
                    </div>
                </div>
            </header>

            <div id="chart-container">
                <!-- Purple Zone -->
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>

    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>同步历史数据</h3>
            <p>这将从网络下载所有A股的最新数据。此操作可能需要几分钟并在后台运行。是否继续？</p>
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="action-btn">取消</button>
                <button id="modal-confirm-btn" class="action-btn primary">确定</button>
            </div>
        </div>
    </div>


    <!-- Backtest Result Modal -->
    <div id="backtest-modal" class="modal hidden">
        <div class="modal-content backtest-content">
            <h3>回测结果 <span id="backtest-symbol"></span></h3>
            <div class="backtest-summary">
                <div class="summary-item">
                    <span class="label">初始资金:</span>
                    <span id="bt-initial" class="value"></span>
                </div>
                <div class="summary-item">
                    <span class="label">最终资金:</span>
                    <span id="bt-final" class="value"></span>
                </div>
                <div class="summary-item">
                    <span class="label">总收益率:</span>
                    <span id="bt-profit" class="value"></span>
                </div>
                <div class="summary-item">
                    <span class="label">交易次数:</span>
                    <span id="bt-trades" class="value"></span>
                </div>
                <div class="summary-item">
                    <span class="label">胜率:</span>
                    <span id="bt-winrate" class="value"></span>
                </div>
            </div>

            <div class="backtest-table-container">
                <table id="backtest-table">
                    <thead>
                        <tr>
                            <th>买入日期</th>
                            <th>买入价</th>
                            <th>卖出日期</th>
                            <th>卖出原因</th>
                            <th>卖出价</th>
                            <th>收益率(%)</th>
                            <th>持股(天)</th>
                            <th>结算后资金</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>

            <div class="modal-actions" style="margin-top: 20px; text-align: right;">
                <button id="modal-close-bt-btn" class="action-btn">关闭</button>
            </div>
        </div>
    </div>

    <div id="sync-progress-container" class="hidden">
        <div class="progress-info">
            <span id="sync-status-text">准备下载...</span>
            <span id="sync-percentage">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div id="sync-progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>

    <div id="toast-container"></div>
</body>
</html>
